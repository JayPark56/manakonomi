<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Manakonomi</title>
    <meta name="description" content="Find manga similar to ones you loved." />

    <!-- PWA manifest (Expo injects theme-color + favicon.ico from app.json). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <!-- iOS add-to-home-screen support -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Manakonomi" />

    <!-- react-native-web style reset (normally auto-injected; required here
         because a custom index.html replaces the default template body). -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* Black everywhere so the bottom safe-area (home indicator) and any
           overscroll never flash the default white in the installed PWA. */
        background-color: #000000;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #000000;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Register the workbox service worker (only present in the exported
         build; harmlessly no-ops on the dev server where /sw.js is absent). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* No service worker in dev — ignore. */
          });
        });
      }
    </script>
  </body>
</html>
